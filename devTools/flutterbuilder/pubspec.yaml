name: dol
description: "DoL by Alex -- the Degrees of Lewdity Android app."
publish_to: "none"

# Overridden on every build by --build-name / --build-code in
# scripts/build_app_flutter.js, which reads the version out of
# game/01-config/sugarcubeConfig.js. These are only defaults for `flutter run`.
#
# The game's real version has four components (0.5.12.13), which is a legal
# Android versionName but not legal semver, so the default here is truncated.
# The build script passes the full four-part string through --build-name.
version: 0.5.12+511213

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Provides the WebView plus the request interception that lets the bundled
  # game be served from https://localhost, which is what keeps existing
  # players' localStorage saves reachable. See lib/src/web_asset_server.dart.
  #
  # Pinned to a prerelease on purpose. The 6.1.x line (still the latest *stable*)
  # is from Oct 2024 and calls getDefaultProguardFile('proguard-android.txt'),
  # which AGP 9 rejects outright, so it cannot build at all. The fix landed on
  # master in January 2026 and shipped in this prerelease. Do not move this back
  # to a caret range on 6.1.x without checking that file first.
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assembled by scripts/prepare_flutter_assets.js from the compiled game.
  # This directory is generated; do not edit or commit it.
  assets:
    - assets/web/index.html
    - assets/web/flutter_additions.js

    # DO NOT ADD img/ HERE AS A SINGLE ENTRY.
    #
    # Flutter's directory entries are NOT recursive: they bundle only the files
    # sitting directly in that directory. Listing `assets/web/img/` alone ships
    # the 18,740 images as *zero* images (img/ itself holds only three stray
    # build files), and the game then loads with no artwork and no error.
    #
    # The per-directory list below is generated by
    # scripts/prepare_flutter_assets.js, which runs on every build and fails if
    # the list does not cover the tree. Edit that script, not this block.
