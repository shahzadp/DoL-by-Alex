<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    Degrees of Lewdity app mark.
    Source of truth for assets/icon-only.svg; mirrored by hand into
    res/drawable/ic_dol_mark.xml (splash) and ic_launcher_foreground.xml (icon).
    Keep the three in step when editing.

    The white base layer is intentional and must stay: it is the launcher
    icon's background (@color/ic_launcher_background). The splash does not use
    this file - it uses the same mark on a dark backdrop
    (@color/dol_splash_background).
  -->

  <!-- White base -->
  <rect width="108" height="108" fill="#FFFFFF"/>

  <!-- Top-left: pink / red -->
  <path fill="#EF476F" d="M28,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

  <!-- Top-right: yellow -->
  <path fill="#FFD166" d="M61,22h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

  <!-- Bottom-left: teal / green -->
  <path fill="#06D6A0" d="M28,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

  <!-- Bottom-right: blue -->
  <path fill="#118AB2" d="M61,55h19a6,6 0 0 1 6,6v19a6,6 0 0 1 -6,6h-19a6,6 0 0 1 -6,-6v-19a6,6 0 0 1 6,-6z"/>

  <!-- Centred monogram: letter D (44 tall, 18-unit stem, full-height semicircular bowl, nonZero counter) -->
  <path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
        d="M37.72,76L37.72,32L48.28,32A22,22 0 0 1 48.28,76Z
           M45.64,68.08L48.28,68.08A14.08,14.08 0 0 0 48.28,39.92L45.64,39.92Z"/>
</svg>