org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# R8 full mode reports an unresolved class reference as an error rather than a
# warning. That is the right default, and it is what surfaced a real
# incompatibility here: flutter_inappwebview_android 1.2.0-beta.3 runs R8 over
# its *own* module (`:flutter_inappwebview_android:minifyReleaseWithR8`) without
# android.jar on the classpath, so it reports 182 missing classes -- including
# android.app.Activity and android.annotation.SuppressLint, which are certainly
# present. The plugin is a prerelease pinned only because 6.1.5 cannot build
# under AGP 9 at all, so this pairing is knowingly bleeding edge.
#
# The app's own R8 pass is unaffected: it resolves those classes fine. Turning
# full mode off keeps minification and shrinking, and only demotes the plugin's
# unresolved references from build-stopping errors to warnings.
#
# Revisit when the plugin ships a stable release: this line should be deleted
# then, because it also demotes genuine missing-class errors.
android.enableR8.fullMode=false
